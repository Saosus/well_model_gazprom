map $uri $api_target {
    ~^/ipr/    ipr:8003;
    ~^/vlp/    vlp:8002;
    ~^/nodal/  nodal:8004;
    default    backend:8080;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS обновляет адрес при пересоздании контейнера.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 190s;

    # У каждого FastAPI собственные /docs и /openapi.json.
    location ~ ^/(?:ipr|vlp|nodal)/(?<metadata>docs|openapi\.json)$ {
        proxy_pass http://$api_target/$metadata$is_args$args;
    }

    location ~ ^/(?:(?:api|ipr|vlp|nodal|_swagger)/|(?:health|docs|openapi\.json)$) {
        proxy_pass http://$api_target;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
