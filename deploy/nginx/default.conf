map $http_x_forwarded_proto $wmb_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wmb_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 70s;
    proxy_read_timeout 70s;
    proxy_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Dashboard API.
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Backend routes and Swagger UI under a unique public prefix.
    location = /backend/docs {
        proxy_pass http://backend:8080/docs;
    }
    location = /backend/openapi.json {
        proxy_pass http://backend:8080/openapi.json;
    }
    location ^~ /backend/_swagger/ {
        rewrite ^/backend/_swagger/(.*)$ /_swagger/$1 break;
        proxy_pass http://backend:8080;
    }
    location ^~ /backend/ {
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
    }

    # IPR API, health and service-specific Swagger UI.
    location = /ipr/docs {
        proxy_pass http://ipr:8003/docs;
    }
    location = /ipr/openapi.json {
        proxy_pass http://ipr:8003/openapi.json;
    }
    location ^~ /ipr/_swagger/ {
        rewrite ^/ipr/_swagger/(.*)$ /_swagger/$1 break;
        proxy_pass http://ipr:8003;
    }
    location ^~ /ipr/ {
        proxy_pass http://ipr:8003;
    }

    # VLP API, health and service-specific Swagger UI.
    location = /vlp/docs {
        proxy_pass http://vlp:8002/docs;
    }
    location = /vlp/openapi.json {
        proxy_pass http://vlp:8002/openapi.json;
    }
    location ^~ /vlp/_swagger/ {
        rewrite ^/vlp/_swagger/(.*)$ /_swagger/$1 break;
        proxy_pass http://vlp:8002;
    }
    location ^~ /vlp/ {
        proxy_pass http://vlp:8002;
    }

    # Nodal API, health and service-specific Swagger UI.
    location = /nodal/docs {
        proxy_pass http://nodal:8004/docs;
    }
    location = /nodal/openapi.json {
        proxy_pass http://nodal:8004/openapi.json;
    }
    location ^~ /nodal/_swagger/ {
        rewrite ^/nodal/_swagger/(.*)$ /_swagger/$1 break;
        proxy_pass http://nodal:8004;
    }
    location ^~ /nodal/ {
        proxy_pass http://nodal:8004;
    }

    # Native backend health endpoint remains available through the proxy.
    location = /health {
        proxy_pass http://backend:8080/health;
    }

    # Keep old root docs convenient, but expose the backend schema only once.
    location = /docs { return 302 /backend/docs; }
    location = /openapi.json { return 302 /backend/openapi.json; }

    # Static frontend is included in the Nginx image at build time.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
