name: Well Model Builder CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests, accuracy and frontend logic
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q services shared scripts tests

      - name: Run pytest suite
        run: |
          mkdir -p test-results
          python -m pytest -q --junitxml=test-results/pytest-junit.xml

      - name: Run accuracy, HTTP and E2E verification
        run: python -m scripts.verify_accuracy --report accuracy-report.md

      - name: Run frontend JavaScript regression checks
        run: |
          node --experimental-default-type=module scripts/check_assistant_ui_logic.mjs
          node --experimental-default-type=module scripts/check_analysis_ui_logic.mjs
          node --experimental-default-type=module scripts/check_number_format.mjs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            test-results/pytest-junit.xml
            accuracy-report.md
          if-no-files-found: warn
          retention-days: 14

  docker-integration:
    name: Docker build and HTTP integration
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build the complete Compose application
        run: docker compose build --parallel

      - name: Build and run the Docker pytest image
        run: |
          docker build --target tests -t well-model-builder-tests:ci .
          docker run --rm well-model-builder-tests:ci

      - name: Start the complete application
        env:
          NGINX_PORT: "18000"
        run: docker compose up -d --build --wait

      - name: Run HTTP smoke and end-to-end checks through Nginx
        run: docker compose exec -T backend python scripts/smoke.py --compose

      - name: Stop Docker Compose application
        if: always()
        run: docker compose down --remove-orphans --volumes
